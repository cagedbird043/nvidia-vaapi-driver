[package]
name = "rustnv-vaapi"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "rustnv_drv_video"
crate-type = ["cdylib"]

[dependencies]
# Local development overrides this with a path [patch] in .cargo/config.toml (not committed).
nvrm = { package = "nv-bionic-native", git = "https://github.com/cagedbird043/nvrm", rev = "b18a221132dfb3f66e0e1f1e12f910f9e43e5ff1", default-features = false }

[build-dependencies]
bindgen = "0.72"
