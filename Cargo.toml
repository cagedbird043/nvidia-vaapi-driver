[package]
name = "rustnv-vaapi"
version = "0.2.2"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "rustnv_drv_video"
crate-type = ["cdylib"]

[dependencies]
# Local development overrides this with a path [patch] in .cargo/config.toml (not committed).
nvrm = { package = "nv-bionic-native", git = "https://github.com/cagedbird043/nvrm", rev = "dce401dac2b81df2df6abd0300a588ba19e1971a", default-features = false }

[build-dependencies]
bindgen = "0.72"
