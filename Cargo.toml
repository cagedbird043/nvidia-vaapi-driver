[package]
name = "rustnv-vaapi"
version = "0.2.5"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "rustnv_drv_video"
crate-type = ["cdylib"]

[dependencies]
# Local development overrides this with a path [patch] in .cargo/config.toml (not committed).
nvrm = { package = "nv-bionic-native", git = "https://github.com/cagedbird043/nvrm", rev = "5fcba81e78fa95e03fc816f3adc030e2f887a003", default-features = false }

[build-dependencies]
bindgen = "0.72"
