[package]
name = "rustnv-vaapi"
version = "0.2.1"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "rustnv_drv_video"
crate-type = ["cdylib"]

[dependencies]
# Local development overrides this with a path [patch] in .cargo/config.toml (not committed).
nvrm = { package = "nv-bionic-native", git = "https://github.com/cagedbird043/nvrm", rev = "fbfe3d384e27e5621473096e5e27764336094a67", default-features = false }

[build-dependencies]
bindgen = "0.72"
