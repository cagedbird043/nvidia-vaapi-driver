[package]
name = "rustnv-vaapi"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "rustnv_drv_video"
crate-type = ["cdylib"]

[dependencies]
# Local development overrides this with a path [patch] in .cargo/config.toml (not committed).
nvrm = { package = "nv-bionic-native", git = "https://github.com/cagedbird043/nvrm", rev = "f4b6c0c42478778b5d1a59bca33652a8de269f8a", default-features = false }

[build-dependencies]
bindgen = "0.72"
